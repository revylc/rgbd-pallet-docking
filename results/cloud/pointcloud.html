canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.57,Math.min(1.57,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};
canvas.onpointerup=canvas.onpointercancel=()=>{drag=null};canvas.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.2,Math.min(4,scale*Math.exp(-e.deltaY*.001)));draw()},{passive:false});
document.querySelector('#count').textContent=points.length.toLocaleString()+' 个观测点';window.onresize=draw;reset();
</script></html>
