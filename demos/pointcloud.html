<!doctype html>
<html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RGB-D 托盘点云</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102327;color:#f0f2e8;font:16px/1.5 system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:clamp(16px,4vw,52px)}h1{font-size:clamp(25px,4vw,42px);font-weight:600;margin:0}
p{color:#c4d4ce}canvas{width:100%;height:min(63vh,570px);background:#152d32;border:1px solid #547571;border-radius:8px;touch-action:none;cursor:grab}
button{border:1px solid #8daba4;border-radius:5px;padding:6px 12px;background:transparent;color:inherit;cursor:pointer}button:focus{outline:2px solid #ffd557}
</style><main><h1>托盘的三维点云</h1><p>拖动旋转，滚轮缩放。每个点来自同一帧深度图，颜色取自对应的 RGB 像素。转到背面时，可以看到单帧相机留下的观测空缺。</p>
<canvas id="view" aria-label="可旋转的三维托盘点云"></canvas>
<p><button id="reset">恢复视角</button>　<button id="top">俯视</button>　<span id="count"></span></p></main>
<script>
const raw=atob('__VERTICES__'), bytes=Uint8Array.from(raw, c=>c.charCodeAt(0)), data=new DataView(bytes.buffer);
const points=[];for(let i=0;i<bytes.length;i+=15){points.push([data.getFloat32(i,true)-2,data.getFloat32(i+4,true),data.getFloat32(i+8,true)-.25,
  'rgb('+bytes[i+12]+','+bytes[i+13]+','+bytes[i+14]+')']);}
const canvas=document.querySelector('#view'),ctx=canvas.getContext('2d');let yaw,pitch,scale,drag=null;
function draw(){const box=canvas.getBoundingClientRect(),dpr=window.devicePixelRatio||1;
canvas.width=Math.round(box.width*dpr);canvas.height=Math.round(box.height*dpr);ctx.scale(dpr,dpr);
const sy=Math.sin(yaw),cy=Math.cos(yaw),sp=Math.sin(pitch),cp=Math.cos(pitch),zoom=Math.min(box.width*.6,box.height)*scale;
const visible=points.map(([x,y,z,color])=>{const forward=x*cy+y*sy;return [forward*cp-z*sp,box.width/2+(x*sy-y*cy)*zoom,box.height*.51-(z*cp+forward*sp)*zoom,color]});
visible.sort((a,b)=>b[0]-a[0]);for(const p of visible){ctx.fillStyle=p[3];ctx.fillRect(p[1],p[2],3.1,3.1)}}
function reset(){yaw=-.38;pitch=.18;scale=.85;draw()}document.querySelector('#reset').onclick=reset;
document.querySelector('#top').onclick=()=>{yaw=0;pitch=Math.PI/2;draw()};
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};
canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-1.57,Math.min(1.57,pitch+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];draw()};
canvas.onpointerup=canvas.onpointercancel=()=>{drag=null};canvas.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.2,Math.min(4,scale*Math.exp(-e.deltaY*.001)));draw()},{passive:false});
document.querySelector('#count').textContent=points.length.toLocaleString()+' 个观测点';window.onresize=draw;reset();
</script></html>
